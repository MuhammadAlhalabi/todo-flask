<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common_style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register_style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='fontawesome/css/all.min.css') }}">
    <title>Sign Up</title>
</head>

<body>
    <header>
        <nav>
            <div class="logo">
                <a href="">To-Do</a>
            </div>
            <ul>
                <li><a href="{{url_for('login')}}">Log In</a></li>
                <li><a href="{{url_for('register')}}">Sign Up</a></li>
                <li>
                    <a href="#" class="contact-up">Contact</a>
                    <div class="contact-down">
                        <a href="">Facebook</a>
                        <a href="">Whatsapp</a>
                        <a href="">Telegram</a>
                    </div>
                </li>
                <li><a href="">About</a></li>
            </ul>
        </nav>
    </header>

    <div class="form-container">
        <form action="/register" method="post">
            <h1>إنشاء حساب جديد</h1>

            <div class="form-group">
                <label for="user-name">اسم المستخدم</label>
                <input type="text" name="username" id="user-name" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label for="password">كلمة السر</label>
                <div class="password-field">
                    <input type="password" name="password" id="password" autocomplete="new-password" required>
                    <button type="button" class="toggle-password" data-target="password" aria-label="إظهار كلمة السر">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <input type="submit" value="تسجيل">

            <a href="{{url_for('login')}}">العودة لصفحة تسجيل الدخول</a>

            {%with messages=get_flashed_messages(with_categories=true)%}
            {%if messages%}
            {%for category,message in messages%}
            <p class="{{category}}">{{message}}</p>
            {%endfor%}
            {%endif%}
            {%endwith%}
        </form>
    </div>
    <script src="{{ url_for('static', filename='js/common.js') }}"></script>
</body>

</html>
